name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce existing data audit
        run: python scripts/audit_data.py --check
      - name: Smoke test evaluator CLI
        run: aq examples/eval/responses.json --rubric examples/eval/rubric.json --compact
      - name: Smoke test pairwise comparison CLI
        run: aq compare examples/eval/model-a.json examples/eval/model-b.json --rubric examples/eval/rubric.json --left-name model_a --right-name model_b --compact
