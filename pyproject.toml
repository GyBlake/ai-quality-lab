readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PrimeÆClyptic"}]
dependencies = []

[project.scripts]
aq = "ai_quality.cli:main"

[tool.setuptools]
packages = ["ai_quality"]
